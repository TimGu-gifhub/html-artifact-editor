<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2025 年度报告（脱敏样例）</title>
<style>
  body {
    margin: 0; padding: 40px 20px;
    font-family: "Segoe UI", system-ui, "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #eef0f3; color: #24292f; font-size: 15px; line-height: 1.8;
  }
  article {
    max-width: 720px; margin: 0 auto; background: #fff;
    border: 1px solid #d8dde3; border-radius: 4px;
    box-shadow: 0 2px 10px rgba(15, 23, 42, 0.07);
    padding: 48px 56px 56px;
  }
  h1 { font-size: 26px; line-height: 1.35; margin: 0 0 6px; }
  .subtitle { margin: 0 0 8px; padding-bottom: 18px; color: #6a7280; font-size: 13px; border-bottom: 1px solid #e3e7ec; }
  h2 { font-size: 17px; margin: 30px 0 10px; padding-left: 10px; border-left: 3px solid #c9d4e4; }
  p { margin: 0 0 12px; }
  table { width: 100%; border-collapse: collapse; margin: 14px 0 6px; font-size: 14px; }
  th, td { border: 1px solid #dfe3e8; padding: 8px 12px; text-align: left; }
  th { background: #f4f6f9; }
</style>
</head>
<body>
<article>
  <h1>2025 年度报告</h1>
  <p class="subtitle">编制日期：2025 年 12 月 31 日</p>
  <h2>一、经营概况</h2>
  <p>报告期内，公司整体经营保持稳健，主要业务按计划推进，供应链与交付未发生重大中断事项。</p>
  <table>
    <thead>
      <tr><th scope="col">指标</th><th scope="col">数值</th><th scope="col">备注</th></tr>
    </thead>
    <tbody>
      <tr><td>营业收入</td><td>12,580 万元</td><td>同比增涨 8.2%</td></tr>
      <tr><td>净利润</td><td>1,036 万元</td><td>同比增长 5.4%</td></tr>
      <tr><td>研发投人占比</td><td>15.0%</td><td>较上年提高 1.2 个百分点</td></tr>
      <tr><td>回款率</td><td>92%</td><td>第四季渡数据，含逾期 30 天以上款项</td></tr>
    </tbody>
  </table>
  <h2>二、下一年度展望</h2>
  <p>下一年度将继续加大研发投入，重点推进核心产品迭代与市场渠道建设，保持稳健经营节奏。</p>
</article>
</body>
</html>
