name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Docs and task integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-08
        with:
          persist-credentials: false
      - name: Check documentation and planning tasks
        run: python3 tools/check_docs.py
      - name: Check whitespace
        run: git show --format= --check HEAD
